
name: CI/CD with CodeSage Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:

  # ============================================================
  # 1. CODESAGE REVIEW
  # ============================================================

  codesage-review:
    name: 🤖 CodeSage Code Review
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run CodeSage Review
        id: review
        env:
          CODESAGE_URL: ${{ secrets.CODESAGE_URL }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |

          echo "========================================"
          echo "🤖 Sending PR to CodeSage..."
          echo "========================================"

          echo "PR URL: $PR_URL"
          echo "CodeSage URL: $CODESAGE_URL"

          # Appel de CodeSage
          curl -sS -X POST \
            "$CODESAGE_URL/api/ide/review" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c 'import json, os; print(json.dumps({
              "pr_url": os.environ["PR_URL"],
              "command": "/review"
            }))')" \
            --max-time 900 \
            -o codesage-response.json

          echo "----------------------------------------"
          echo "CodeSage response:"
          cat codesage-response.json
          echo "----------------------------------------"

          # Vérifier que la réponse existe
          if [ ! -s codesage-response.json ]; then
            echo "❌ CodeSage returned an empty response"
            exit 1
          fi

          # Vérifier que la réponse est un JSON valide
          if ! jq empty codesage-response.json 2>/dev/null; then
            echo "❌ CodeSage returned invalid JSON"
            exit 1
          fi

          # Vérifier le résultat
          RESULT=$(jq -r '.result // empty' codesage-response.json)

          if [ -z "$RESULT" ]; then
            echo "❌ CodeSage did not return a review result"
            exit 1
          fi

          # Extraire le score
          SCORE=$(echo "$RESULT" | \
            grep -oE '[Ss]core[^0-9]*[0-9]{1,3}[[:space:]]*/[[:space:]]*100' | \
            grep -oE '[0-9]{1,3}' | \
            head -1)

          # Si aucun score
          if [ -z "$SCORE" ]; then
            echo "⚠️ No score detected"
            SCORE=0
          fi

          echo "score=$SCORE" >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "📊 CodeSage Score: $SCORE/100"
          echo "========================================"


      # ==========================================================
      # POST COMMENT
      # ==========================================================

      - name: Post Review Comment on PR
        uses: actions/github-script@v7
        env:
          CODESAGE_SCORE: ${{ steps.review.outputs.score }}
        with:
          script: |

            const fs = require('fs');

            let response;

            try {
              response = JSON.parse(
                fs.readFileSync('codesage-response.json', 'utf8')
              );
            } catch (error) {
              core.setFailed(
                'Unable to read CodeSage response'
              );
              return;
            }

            const result =
              response.result ||
              '❌ No result from CodeSage';

            const score =
              process.env.CODESAGE_SCORE || 'N/A';

            const body = `
            ## 🤖 CodeSage AI Code Review

            **Score: ${score}/100**

            ---

            ${result}

            ---

            _Review automatically generated by CodeSage._
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });


      # ==========================================================
      # QUALITY GATE
      # ==========================================================

      - name: Check CodeSage Score
        env:
          SCORE: ${{ steps.review.outputs.score }}
        run: |

          echo "========================================"
          echo "🔎 CodeSage Quality Gate"
          echo "========================================"

          echo "Score: $SCORE/100"
          echo "Minimum required: 60/100"

          if [ "$SCORE" -lt 60 ]; then
            echo ""
            echo "❌ CodeSage Quality Gate FAILED"
            echo "❌ Score too low: $SCORE/100"
            exit 1
          fi

          echo ""
          echo "✅ CodeSage Quality Gate PASSED"


  # ============================================================
  # 2. BUILD + TEST
  # ============================================================

  build:
    name: 📦 Build & Test
    runs-on: ubuntu-latest

    needs:
      - codesage-review

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: |
          mvn clean verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error


  # ============================================================
  # 3. DOCKER BUILD & PUSH
  # ============================================================

  docker:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest

    needs:
      - build

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set Docker image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            -t braiki89/eventconnect:${IMAGE_TAG} \
            -t braiki89/eventconnect:latest \
            .

      - name: Push Docker image
        run: |
          docker push braiki89/eventconnect:${IMAGE_TAG}
          docker push braiki89/eventconnect:latest

      - name: Display Docker image
        run: |
          echo "🐳 Image pushed:"
          echo "braiki89/eventconnect:${IMAGE_TAG}"
          echo "braiki89/eventconnect:latest"


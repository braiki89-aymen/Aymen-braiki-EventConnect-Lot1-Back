name: CI/CD with CodeSage Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

jobs:

  # ── 1. CodeSage Review ──────────────────────────────────────────
  codesage-review:
    name: 🤖 CodeSage Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run CodeSage Review
        id: review
        run: |
          echo "🤖 Sending PR to CodeSage..."

          RESPONSE=$(curl -s -X POST \
            "${{ secrets.CODESAGE_URL }}/api/ide/review" \
            -H "Content-Type: application/json" \
            -d '{
              "pr_url": "${{ github.event.pull_request.html_url }}",
              "command": "/review"
            }' \
            --max-time 900)

          echo "response=$RESPONSE" >> $GITHUB_OUTPUT

          # Extrait le score
          SCORE=$(echo "$RESPONSE" | python3 -c "
          import sys, json, re
          try:
              data = json.loads(sys.stdin.read())
              result = data.get('result', '')
              match = re.search(r'Score.*?(\d+)/100', result)
              print(match.group(1) if match else '0')
          except:
              print('0')
          ")

          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "📊 CodeSage Score: $SCORE/100"

      - name: Post Review Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const response = JSON.parse(`${{ steps.review.outputs.response }}`);
            const result   = response.result || '❌ No result from CodeSage';
            const score    = ${{ steps.review.outputs.score }};

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              body:         result,
            });

      - name: Check Score Threshold
        run: |
          SCORE=${{ steps.review.outputs.score }}
          echo "📊 Final Score: $SCORE/100"

          if [ "$SCORE" -lt "60" ]; then
            echo "❌ Score too low: $SCORE/100 (minimum: 60)"
            exit 1
          fi

          echo "✅ Score accepted: $SCORE/100"

  # ── 2. Build Maven ──────────────────────────────────────────────
  build:
    name: 📦 Build Maven
    runs-on: ubuntu-latest
    needs: codesage-review   # attend que la review soit OK

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # ── 3. Docker Build & Push ──────────────────────────────────────
  docker:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: build   # attend que le build soit OK

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t braiki89/eventconnect:latest .

      - name: Push Docker image
        run: docker push braiki89/eventconnect:latest
